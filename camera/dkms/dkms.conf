# The Duet 5's camera modules, rebuilt by DKMS for every kernel the system
# installs:
#   qcom-camss  Linux 7.3's CAMSS driver with SC7180 support added
#               (../0001-media-qcom-camss-add-sc7180-support.patch)
#   ov5675      the front sensor's driver, which Arch Linux ARM doesn't build
# Both install under updates/, so the patched CAMSS takes the place of the
# kernel's own.
PACKAGE_NAME="duet5-camera"
PACKAGE_VERSION="1"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/camss modules && make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/ov5675 modules"

BUILT_MODULE_NAME[0]="qcom-camss"
BUILT_MODULE_LOCATION[0]="camss/"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="ov5675"
BUILT_MODULE_LOCATION[1]="ov5675/"
DEST_MODULE_LOCATION[1]="/updates"

AUTOINSTALL="yes"
