# From the Omarchy Chromebook port. The Duet 5's speaker sink is four-channel
# (see omarchy-chromebook-ucm); copy stereo L/R onto the rear channels too, so
# nothing plays into silent channels. A two-channel sink is unaffected.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
      }
    }
  }
]
