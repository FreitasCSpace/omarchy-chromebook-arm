# Drop-in for rmtfs-dir.service (rmtfs-git), from the Omarchy Chromebook port.
# Trogdor's Wi-Fi (WCN3990) runs on the modem, and the modem only boots once
# rmtfs serves its storage and starts it: -r starts the remoteproc whose
# compatible names an MSS (qcom,sc7180-mss-pil). The Chromebook has no
# modemst1/modemst2/fsg partitions, so the storage lives in files (-o).
[Service]
StateDirectory=rmtfs
# The modem's EFS asks for these 2 MiB regions on every boot and crashes when
# one is missing ("rmts_get_buffer api failed"); rmtfs opens files without
# creating them. Empty ones are fine: the modem formats them the first time.
ExecStartPre=/bin/sh -c 'for f in modem_fs1 modem_fs2 modem_fsc modem_fsg; do [ -e /var/lib/rmtfs/$f ] || truncate -s 2M /var/lib/rmtfs/$f; done'
ExecStart=
ExecStart=/usr/bin/rmtfs -r -s -o /var/lib/rmtfs
