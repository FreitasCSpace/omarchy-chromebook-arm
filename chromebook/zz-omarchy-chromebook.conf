# Generated by the Omarchy Chromebook port; sorts after every Omarchy drop-in.
# btrfs-overlayfs boots Limine's read-only snapshot entries and ships with
# limine-snapper-sync. Depthcharge has no snapshot menu and no Limine, so the
# hook neither exists nor has anything to boot here.
_omarchy_chromebook_hooks=()
for _omarchy_chromebook_hook in "${HOOKS[@]}"; do
  [[ $_omarchy_chromebook_hook == "btrfs-overlayfs" ]] || _omarchy_chromebook_hooks+=("$_omarchy_chromebook_hook")
done
HOOKS=("${_omarchy_chromebook_hooks[@]}")
unset _omarchy_chromebook_hooks _omarchy_chromebook_hook

# Depthcharge leaves no framebuffer behind, so the panel stays dark until the
# display driver loads. Loading it from the initramfs shows boot messages and
# any initramfs failure instead of a black screen. The ? skips a module a
# kernel lacks: the Duet 5's OLED (atna33xc20), eDP panels on the other
# trogdor laptops, and the Duet 3's DSI panel.
MODULES+=(msm? panel-samsung-atna33xc20? panel-edp? panel-boe-tv101wum-nl6?)
